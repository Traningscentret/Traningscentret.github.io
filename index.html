<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TräningsCentret</title>

    <link rel="icon" href="assets/pictures/old-logo.png" type="image/x-icon">

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/home.css">

    <script type="module" src="js/router.js"></script>
</head>

<body>

    <header class="site-header">

        <nav class="main-navigation" aria-label="Huvudnavigation">

            <button
                id="home-logo-button"
                class="logo-button"
                type="button"
                aria-label="Gå till startsidan"
            >
                <img
                    src="assets/pictures/old-logo.png"
                    alt="TräningsCentret Trelleborg"
                >
            </button>

            <button
                id="menu-button"
                class="menu-button"
                type="button"
                aria-label="Öppna meny"
                aria-expanded="false"
                aria-controls="nav-menu"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>

            <ul id="nav-menu" class="nav-list">

                <li class="mobile-only">
                    <button id="home-button" type="button">
                        Hem
                    </button>
                </li>

                <li class="mobile-only">
                    <button id="registration-button" type="button">
                        Anmälan
                    </button>
                </li>

                <li>
                    <button id="activities-button" type="button">
                        Aktiviteter
                    </button>
                </li>

                <li>
                    <button id="schedule-button" type="button">
                        Schema
                    </button>
                </li>

                <li class="desktop-only">
                    <button id="prices-button" type="button">
                        Priser
                    </button>
                </li>

                <li>
                    <button id="about-button" type="button">
                        Om oss
                    </button>
                </li>

                <li class="gymnastics-link">
                    <a
                        href="https://www.gymnastik.se/"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        <img
                            class="redirect-icon"
                            src="assets/symbols/redirect-link.png"
                            alt=""
                            aria-hidden="true"
                        >

                        <img
                            class="gymnastics-logo"
                            src="assets/symbols/svensk-gymnastic.png"
                            alt="Svensk Gymnastik"
                        >
                    </a>
                </li>

            </ul>

        </nav>

    </header>

    <main id="app"></main>
<footer class="common-footer">
    <section class="footer-contact">
        <h2>Kontakt</h2>

        <p>
            traningscentretTrbg@gmail.com
        </p>
    </section>

    <img
        class="footer-logo"
        src="assets/pictures/logo-footer.png"
        alt="TräningsCentret Trelleborg"
    >
</footer>
</body>

</html>
